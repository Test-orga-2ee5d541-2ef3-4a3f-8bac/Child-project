name: Notify docs site
on:
  push:
    tags:
      - 'v*'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          owner: Test-orga-2ee5d541-2ef3-4a3f-8bac
          repositories: Parent-project

      - name: Trigger parent rebuild
        run: |
          curl -X POST \
            -H "Authorization: token ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Test-orga-2ee5d541-2ef3-4a3f-8bac/Parent-project/dispatches \
            -d '{"event_type":"child-docs-updated"}'