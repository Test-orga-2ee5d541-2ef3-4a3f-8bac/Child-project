name: Notify parent docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    uses: Test-orga-2ee5d541-2ef3-4a3f-8bac/docs-workflows/.github/workflows/notify-parent-docs.yml@v1
    with:
      event_type: 'child project trigger'
    secrets:
      app_id: ${{ secrets.DOCS_SYNC_APP_ID }}
      app_private_key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}