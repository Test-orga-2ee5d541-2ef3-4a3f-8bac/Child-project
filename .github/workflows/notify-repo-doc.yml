name: notify-repo-doc.yml
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          owner: Test-orga-2ee5d541-2ef3-4a3f-8bac
          repositories: Parent-project

      - name: Debug - check token permissions
        run: |
          curl -s -H "Authorization: token ${{ steps.app-token.outputs.token }}" \
            https://api.github.com/installation/repositories | jq '.repositories[].permissions // .permissions'